{% extends "control/base.html" %}

{% block title %}Eliminar cliente | Agenda Simple{% endblock %}

{% block content %}
    <section class="panel confirm-panel">
        <p class="eyebrow">CONFIRMACIÓN</p>
        <h1>Eliminar cliente</h1>
        <p>¿Seguro que quieres eliminar a <strong>{{ cliente }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button class="button button-danger" type="submit">Sí, eliminar</button>
            <a class="button button-secondary" href="{% url 'clientes' %}">Cancelar</a>
        </form>
    </section>
{% endblock %}
