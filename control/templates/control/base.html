{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Agenda Simple{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'control/styles.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'inicio' %}">Agenda<span>Simple</span></a>
        <nav aria-label="Navegación principal">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'clientes' %}">Clientes</a>
            <a href="{% url 'citas' %}">Citas</a>
            <a href="{% url 'admin:index' %}">Administración</a>
        </nav>
    </header>
    <main class="container">
        {% if messages %}
            <div class="messages" role="status">
                {% for message in messages %}
                    <p class="message message-{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">Agenda Simple · Gestión de clientes y citas</footer>
</body>
</html>
